<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XERO Roblox Lookup</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#070a12;color:#eef2ff;font-family:Inter,Segoe UI,Arial,sans-serif}body:before{content:"";position:fixed;inset:-30%;z-index:-1;background:radial-gradient(circle at 15% 15%,#6366f133,transparent 28%),radial-gradient(circle at 85% 20%,#06b6d433,transparent 28%);filter:blur(40px)}.wrap{width:min(1080px,calc(100% - 28px));margin:auto;padding:30px 0 50px}.hero{text-align:center;padding:45px 0 25px}.logo{width:70px;height:70px;margin:auto;border-radius:22px;display:grid;place-items:center;font-size:32px;font-weight:900;background:linear-gradient(135deg,#6366f1,#06b6d4);box-shadow:0 20px 55px #6366f144}.hero h1{font-size:clamp(34px,6vw,58px);margin:18px 0 8px;letter-spacing:-2px}.hero p{color:#96a1bb;margin:0}.search{display:flex;gap:10px;max-width:820px;margin:28px auto 12px;padding:8px;border:1px solid #243047;border-radius:19px;background:#0c111dcc;backdrop-filter:blur(18px)}.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:white;padding:14px 16px;font-size:16px;direction:ltr;text-align:left}.search button{border:0;border-radius:14px;padding:0 25px;color:white;font-weight:900;background:linear-gradient(135deg,#6366f1,#06b6d4);cursor:pointer}.search button:disabled{opacity:.6}.status{text-align:center;min-height:24px;color:#8e9ab5;font-size:13px}.error{color:#fb7185}.ok{color:#34d399}.panel{margin-top:24px;padding:25px;border:1px solid #202b40;border-radius:24px;background:#0d121ed9;box-shadow:0 22px 70px #0006;backdrop-filter:blur(18px)}.hidden{display:none}.profile{display:grid;grid-template-columns:145px 1fr;gap:25px;align-items:center}.avatar{width:145px;height:145px;border-radius:28px;object-fit:cover;background:#151b2a}.name{font-size:32px;font-weight:950}.username{color:#8794b4;margin-top:4px;direction:ltr;text-align:right;display:inline-block}.id{display:inline-block;margin-top:12px;padding:8px 11px;border-radius:10px;border:1px solid #28344b;background:#101624;color:#b5bfd4;font-size:12px;direction:ltr}.bio{margin-top:15px;color:#c8d0df;line-height:1.8;white-space:pre-wrap}.actions{margin-top:16px;display:flex;gap:9px;flex-wrap:wrap}.actions a,.actions button{padding:10px 14px;border-radius:12px;border:1px solid #2a3750;background:#141b2a;color:white;text-decoration:none;cursor:pointer}.actions a{background:linear-gradient(135deg,#6366f1,#5143df);border:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:24px}.stat{padding:18px;border-radius:16px;border:1px solid #222e43;background:#111827}.stat b{font-size:24px;display:block}.stat span{font-size:12px;color:#7f8ba8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.section{padding:20px;border-radius:18px;border:1px solid #202b40;background:#0c111c}.section h3{margin:0 0 12px}.row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #202a3c;color:#aab5ca}.row:last-child{border-bottom:0}.row strong{color:#f4f7ff;text-align:left}.badge{display:flex;justify-content:space-between;gap:10px;padding:11px 12px;margin:7px 0;border-radius:11px;background:#111827;border:1px solid #202a3b}.badge span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.check{color:#34d399;font-weight:900}.empty{text-align:center;color:#8e9ab5;padding:55px 15px}.loader{display:inline-block;width:15px;height:15px;border:2px solid #5b6781;border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-3px;margin-left:6px}@keyframes spin{to{transform:rotate(360deg)}}footer{text-align:center;color:#68738b;font-size:12px;margin-top:30px}@media(max-width:700px){.search{flex-direction:column}.search button{padding:14px}.profile{grid-template-columns:1fr;text-align:center}.avatar{margin:auto}.username{display:block;text-align:center}.id{margin-inline:auto}.actions{justify-content:center}.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<section class="hero"><div class="logo">X</div><h1>Roblox Account Lookup</h1><p>كشف المعلومات العامة لحساب Roblox باستعمال الـ Username فقط</p></section>
<div class="search"><input id="q" placeholder="Username مثل Builderman" autocomplete="off"><button id="btn">بحث 🔎</button></div>
<div id="status" class="status"></div>
<div id="empty" class="panel empty"><h3 style="color:#fff">🔍 ابحث عن حساب</h3><p>اكتب Username واضغط بحث.</p></div>
<div id="result" class="panel hidden"></div>
<footer>المعلومات المعروضة عامة فقط — لا كلمات مرور ولا Cookies ولا بيانات خاصة.</footer>
</div>
<script>
const $=s=>document.querySelector(s);
const q=$('#q'),btn=$('#btn'),status=$('#status'),empty=$('#empty'),result=$('#result');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>v==null?'—':Number(v).toLocaleString('en-US');
const date=v=>{if(!v)return'—';const d=new Date(v);return Number.isNaN(d.getTime())?'—':d.toLocaleDateString('ar-DZ',{year:'numeric',month:'long',day:'numeric'})};

/* Direct Roblox endpoints + a public-domain fallback when the browser blocks CORS. */
function mirror(url){
  const m={
    'users.roblox.com':'users.roproxy.com',
    'thumbnails.roblox.com':'thumbnails.roproxy.com',
    'friends.roblox.com':'friends.roproxy.com',
    'badges.roblox.com':'badges.roproxy.com'
  };
  try{const u=new URL(url);if(m[u.host])u.host=m[u.host];return u.toString()}catch{return url}
}

async function getJSON(url,opts={}){
  const urls=[url,mirror(url)];
  let last=null;
  for(const target of urls){
    try{
      const r=await fetch(target,{...opts,mode:'cors'});
      if(!r.ok){last=new Error('HTTP '+r.status);continue}
      return await r.json();
    }catch(e){last=e}
  }
  throw last||new Error('Failed to fetch');
}

async function resolve(username){
  /* GET endpoint avoids the browser preflight caused by the old POST request. */
  const data=await getJSON('https://users.roblox.com/v1/users/search?keyword='+encodeURIComponent(username)+'&limit=10');
  const exact=(data.data||[]).find(x=>String(x.name).toLowerCase()===username.toLowerCase());
  return exact||data.data?.[0]||null;
}

async function lookup(){
  const username=q.value.trim();
  if(!username){status.innerHTML='<span class="error">اكتب Username أولاً.</span>';return}

  btn.disabled=true;
  status.innerHTML='<span class="loader"></span>جاري البحث...';
  result.classList.add('hidden');
  empty.classList.remove('hidden');

  try{
    const found=await resolve(username);
    if(!found)throw new Error('ما لقيناش هذا الحساب. تأكد من الـ Username.');

    const id=found.id;
    const [u,t,f1,f2,f3,b]=await Promise.allSettled([
      getJSON('https://users.roblox.com/v1/users/'+id),
      getJSON('https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds='+id+'&size=420x420&format=Png&isCircular=false'),
      getJSON('https://friends.roblox.com/v1/users/'+id+'/followers/count'),
      getJSON('https://friends.roblox.com/v1/users/'+id+'/followings/count'),
      getJSON('https://friends.roblox.com/v1/users/'+id+'/friends/count'),
      getJSON('https://badges.roblox.com/v1/users/'+id+'/badges?limit=10&sortOrder=Desc')
    ]);

    const val=x=>x.status==='fulfilled'?x.value:null;
    const user=val(u)||found;
    const thumb=val(t);
    const avatar=thumb?.data?.[0]?.imageUrl||'';
    const badges=val(b)?.data||[];

    result.innerHTML=`
      <div class="profile">
        <img class="avatar" src="${esc(avatar)}" alt="Avatar">
        <div>
          <div class="name">${esc(user.displayName||found.name)}</div>
          <div class="username">@${esc(user.name||found.name)}</div>
          <div class="id">User ID: <b>${esc(id)}</b></div>
          <div class="bio">${esc(user.description||'لا يوجد وصف عام.')}</div>
          <div class="actions">
            <a href="https://www.roblox.com/users/${encodeURIComponent(id)}/profile" target="_blank" rel="noopener">فتح البروفايل ↗</a>
            <button id="copy">نسخ الـ ID</button>
          </div>
        </div>
      </div>
      <div class="stats">
        <div class="stat"><b>${num(val(f3)?.count)}</b><span>الأصدقاء</span></div>
        <div class="stat"><b>${num(val(f1)?.count)}</b><span>المتابعون</span></div>
        <div class="stat"><b>${num(val(f2)?.count)}</b><span>يتابع</span></div>
        <div class="stat"><b>${num(badges.length)}</b><span>Badges المعروضة</span></div>
      </div>
      <div class="grid">
        <div class="section">
          <h3>معلومات الحساب</h3>
          <div class="row"><span>Username</span><strong>${esc(user.name||found.name)}</strong></div>
          <div class="row"><span>Display Name</span><strong>${esc(user.displayName||'—')}</strong></div>
          <div class="row"><span>User ID</span><strong>${esc(id)}</strong></div>
          <div class="row"><span>تاريخ الإنشاء</span><strong>${esc(date(user.created))}</strong></div>
          <div class="row"><span>الحساب محظور</span><strong>${user.isBanned?'نعم':'لا'}</strong></div>
        </div>
        <div class="section">
          <h3>Badges</h3>
          ${badges.length?badges.map(x=>`<div class="badge"><span>${esc(x.name||'Badge')}</span><span class="check">✓</span></div>`).join(''):'<div class="empty" style="padding:20px">لا توجد بيانات Badges متاحة.</div>'}
        </div>
      </div>`;

    empty.classList.add('hidden');
    result.classList.remove('hidden');
    status.innerHTML='<span class="ok">تم العثور على الحساب ✓</span>';

    $('#copy').onclick=async()=>{
      try{await navigator.clipboard.writeText(String(id));$('#copy').textContent='تم النسخ ✓';setTimeout(()=>$('#copy').textContent='نسخ الـ ID',1200)}catch{alert('تعذر النسخ')}
    };
  }catch(e){
    console.error(e);
    status.innerHTML='<span class="error">تعذر الاتصال بـ Roblox. إذا كنت فاتح الملف مباشرة من الكمبيوتر بصيغة file:// ارفع index.html إلى Netlify أو GitHub Pages ثم جرّب.</span>';
  }finally{btn.disabled=false}
}
btn.onclick=lookup;
q.addEventListener('keydown',e=>{if(e.key==='Enter')lookup()});
</script>
</body>
</html>
